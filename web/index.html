<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>coffeshop</title>
    <link rel="stylesheet" href="assets/css/app.css?v=ops-log-1">
    <script defer src="assets/js/i18n.js?v=ops-log-1"></script>
</head>
<body class="home-page">
    <nav class="nav home-nav">
        <div class="nav-inner home-nav-inner">
            <a class="brand" href="index.html">coffeshop</a>
            <div class="home-nav-actions">
                <button id="lang-toggle" class="link lang-toggle home-lang" type="button" onclick="toggleLang()">EN</button>
            </div>
        </div>
    </nav>

    <main class="home-shell">
        <section class="home-hero">
            <div class="home-product" aria-hidden="true">
                <div class="coffee-saucer"></div>
                <div class="coffee-cup">
                    <div class="coffee-rim">
                        <div class="latte-art"></div>
                    </div>
                    <div class="cup-handle"></div>
                </div>
            </div>

            <div class="home-copy">
                <p class="home-kicker" data-i18n="heroEyebrow">Đặt món tại bàn</p>
                <h1 data-i18n="heroTitle">coffeshop</h1>
                <p data-i18n="heroText">Chọn món, gửi đơn và theo dõi trạng thái ngay tại bàn.</p>
                <div class="home-actions">
                    <span class="btn primary big static-btn" data-i18n="openMenu">Quét QR tại bàn</span>
                    <a class="btn big home-secondary" href="order-status.jsp" data-i18n="checkOrder">Kiểm tra đơn</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
